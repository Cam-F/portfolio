<!DOCTYPE HTML>
<html>

<head>
	<title>Cam ツ</title>
	<meta charset="UTF-8">
	<meta name="google" content="notranslate">
	<meta http-equiv="Content-Language" content="en">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<link rel="shortcut icon" type="image/png" href="images/favicon.png" />
	<style>
		body {
			background: #262626;
			position: relative;
		}

		body:before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: 0.16;
			z-index: 0;
			background-image:
				repeating-linear-gradient(
					0deg,
					rgba(0, 0, 0, 0.32) 0px,
					rgba(0, 0, 0, 0.32) 1px,
					rgba(255, 255, 255, 0.035) 2px,
					rgba(255, 255, 255, 0.035) 3px,
					transparent 3px,
					transparent 5px
				);
		}

		#main,
		#footer {
			position: relative;
			z-index: 1;
		}

		#main,
		#banner,
		#footer {
			background: transparent;
		}

		.label-maker-name {
			font-family: "Courier New", "Lucida Console", monospace;
			font-size: 3em;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			display: inline-block;
			color: #f5f5f5;
			background: #050505;
			padding: 0.12em 0.5em;
			margin-bottom: 0.35em;
			border-radius: 3px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			box-shadow:
				0 10px 22px rgba(0, 0, 0, 0.45),
				inset 0 1px 0 rgba(255, 255, 255, 0.16),
				inset 0 -2px 0 rgba(0, 0, 0, 0.8);
			text-shadow:
				0 1px 0 #000,
				0 0 2px rgba(255, 255, 255, 0.35);
			background-image:
				repeating-linear-gradient(
					0deg,
					rgba(255, 255, 255, 0.035) 0px,
					rgba(255, 255, 255, 0.035) 1px,
					transparent 1px,
					transparent 7px
				);
		}

		.label-maker-title {
			font-family: "Courier New", "Lucida Console", monospace;
			font-size: 1.15em;
			letter-spacing: 0.22em;
			text-transform: uppercase;
			color: rgba(255, 255, 255, 0.72);
			margin-top: 0.35em;
			margin-bottom: 0.85em;
		}

		.header-resume-link {
			display: inline-flex;
			align-items: center;
			gap: 0.55em;
			font-family: "Courier New", "Lucida Console", monospace;
			font-size: 0.78em;
			font-weight: 700;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: rgba(255, 255, 255, 0.74);
			border-bottom: 0;
			margin: 0 0 1.2em 0;
		}

		.header-resume-link:hover {
			color: #ffffff;
		}

		.header-resume-link .fa {
			font-size: 0.95em;
			letter-spacing: 0;
		}

		.thumbnails .box.game-card {
			width: 430px;
			max-width: 100%;
		}

		.game-card .image.game-card-main-image img {
			display: block;
			width: 100%;
			height: auto;
			min-height: 0;
			max-height: none;
			object-fit: cover;
		}

		.game-card .inner {
			padding: 2em 2em 2.35em;
		}

		.game-card h3 {
			font-family: "Source Sans Pro", sans-serif;
			font-size: 1.9em;
			font-weight: 700;
			letter-spacing: 0.03em;
			margin: 0 0 0.2em 0;
		}

		.game-card-developer {
			font-family: "Source Sans Pro", sans-serif;
			font-size: 0.98em;
			font-weight: 300;
			letter-spacing: 0.06em;
			color: rgba(255, 255, 255, 0.78);
			margin: 0 0 1.1em 0;
		}

		.game-card-meta {
			display: flex;
			justify-content: center;
			gap: 0.7em;
			flex-wrap: wrap;
			margin: 0 0 1.65em 0;
		}

		.game-card-meta-pill {
			display: inline-block;
			font-family: "Courier New", "Lucida Console", monospace;
			font-size: 0.9em;
			font-weight: 700;
			letter-spacing: 0.05em;
			line-height: 1;
			color: #f5f5f5;
			background: #070707;
			border: 1px solid rgba(255, 255, 255, 0.16);
			border-radius: 3px;
			padding: 0.65em 0.8em;
			box-shadow:
				inset 0 1px 0 rgba(255, 255, 255, 0.12),
				inset 0 -2px 0 rgba(0, 0, 0, 0.75);
			background-image:
				repeating-linear-gradient(
					0deg,
					rgba(255, 255, 255, 0.035) 0px,
					rgba(255, 255, 255, 0.035) 1px,
					transparent 1px,
					transparent 6px
				);
		}

		.game-card-actions {
			max-width: 280px;
			margin: 0 auto 1.85em auto;
		}

		.game-card-actions .button {
			margin-bottom: 1.1em;
		}

		.game-card-actions .button .fa {
			font-size: 1.1em;
			margin-right: 0.6em;
			vertical-align: -0.05em;
		}

		.game-card-actions .button .fa-youtube-play {
			color: #ff0000;
		}

		.game-card-actions .button .fa-steam {
			color: #66c0f4;
		}

		.game-card-description {
			color: rgba(255, 255, 255, 0.88);
			font-weight: 700;
			line-height: 1.45;
			margin: 0;
			text-align: left;
		}

		@media screen and (max-width: 736px) {
			.label-maker-name {
				font-size: 2em;
				letter-spacing: 0.08em;
			}

			.label-maker-title {
				font-size: 0.95em;
				letter-spacing: 0.16em;
			}

			.header-resume-link {
				font-size: 0.72em;
				letter-spacing: 0.14em;
			}
		}
	</style>
</head>

<body id="top">
	<div id="main">

		<!-- data-video="images/vos" -->
		<!-- Banner -->
		<section id="banner">
			<div class="inner">
				<header>
					<h2 class="label-maker-name">Cameron Fuller</h2>
					<p class="label-maker-title">Game Designer</p>
					<a href="images/CameronFullerResume.pdf" target="_blank" class="header-resume-link"><i class="fa fa-file-text" aria-hidden="true"></i> RESUME <i class="fa fa-file-text" aria-hidden="true"></i></a>
					<div>
						<!-- <img src="images/1.jpg" id="profPic"> -->
						<ul class="icons">
							<li><a href="https://www.linkedin.com/in/cameronmfuller/" target="_blank"
									class="icon fa-linkedin"></a></li>
							<li><a href="https://steamcommunity.com/id/CAIVI/" target="_blank" class="icon fa-steam"></a></li>
						</ul>
					</div>
				</header>
			</div>
		</section>

		<!-- Main -->
		<div class="inner">

			<!-- Boxes -->
			<div class="thumbnails">

				<div class="box game-card">
					<a href="https://store.steampowered.com/app/556440/Vicious_Circle/" target="_blank" class="image fit game-card-main-image"><img
							src="images/VC.jpg" alt="Vicious Circle" /></a>
					<div class="inner">
						<h3>Vicious Circle</h3>
						<p class="game-card-developer">Rooster Teeth Games</p>
						<div class="game-card-meta">
							<span class="game-card-meta-pill">QA // Production</span>
							<span class="game-card-meta-pill">2019</span>
						</div>
						<div class="game-card-actions">
							<a href="https://www.youtube.com/watch?v=4lbWPhdU1Us" target="_blank" class="button fit"><i class="fa fa-youtube-play" aria-hidden="true"></i> Trailer</a>
							<a href="https://store.steampowered.com/app/556440/Vicious_Circle/" target="_blank" class="button fit"><i class="fa fa-steam" aria-hidden="true"></i> Steam</a>
						</div>
						<p class="game-card-description">Owned testing for multiplayer features, built test cases and documentation, created and tracked bugs in JIRA, and supported playtesting and feedback sessions.</p>
					</div>
				</div>

			</div>

		</div>
	</div>

	<!-- Footer -->
	<footer id="footer">
		<div class="inner">
			<h2 id="botMarker"></h2>
			<p>just a guy doing things</p>
		</div>
	</footer>

	<!-- Scripts -->
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.scrolly.min.js"></script>
	<script src="assets/js/skel.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>

</body>

</html>
